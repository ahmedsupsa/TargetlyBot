<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07110d"><title>Targetly</title><link rel="stylesheet" href="/app.css"><script src="https://telegram.org/js/telegram-web-app.js?63"></script></head><body><div class="ambient a1"></div><div class="ambient a2"></div><main class="shell"><header class="hero"><div><span class="eyebrow">MERSHHAH • TARGETLY</span><h1>مكتبة الفرص</h1><p>المطاعم المستهدفة، مرتبة وواضحة في مكان واحد.</p></div><button id="addBtn" class="add" aria-label="إضافة">＋</button></header><section class="overview"><div class="bigStat"><span>إجمالي المستهدفين</span><strong id="total">—</strong><small>قاعدة الاستهداف</small></div><div class="miniStats"><div><strong id="areas">—</strong><span>منطقة</span></div><div><strong id="photosStat">—</strong><span>صورة</span></div></div></section><section class="search"><span>⌕</span><input id="q" placeholder="اسم المحل، المنطقة، أو ملاحظة…" autocomplete="off"></section><div id="chips" class="chips"></div><section><div class="sectionTitle"><div><small>DISCOVER</small><h2>المستهدفون</h2></div><span id="count"></span></div><div id="list" class="list"><div class="empty">جاري تجهيز المكتبة…</div></div></section></main><nav class="dock"><button class="active">⌂<span>الرئيسية</span></button><button id="focusSearch">⌕<span>البحث</span></button><button id="dockAdd">＋<span>إضافة</span></button></nav><div id="modal" class="modal hidden"><div class="sheet"><div class="grab"></div><button id="close" class="close">×</button><div id="details"></div></div></div><div id="formModal" class="modal hidden"><div class="sheet formSheet"><div class="grab"></div><button id="formClose" class="close">×</button><div class="formHead"><span class="eyebrow" id="formMode">NEW TARGET</span><h2 id="formTitle">إضافة مستهدف</h2><p>احفظ كل شيء تحتاجه قبل التواصل مع المحل.</p></div><form id="targetForm"><input type="hidden" id="targetId"><label>اسم المحل<input id="name" required placeholder="مثال: نمق"></label><label>المنطقة<input id="city" placeholder="الدمام، الخبر…"></label><label>الروابط<textarea id="links" rows="3" placeholder="كل رابط في سطر"></textarea></label><label>ملاحظات<textarea id="notes" rows="4" placeholder="أي معلومة تساعدك وقت التواصل"></textarea></label><div id="photoArea" class="photoArea hidden"><div class="photoTitle"><div><b>صور المحل</b><span>حتى 20 صورة • 8MB للصورة</span></div><label class="uploadBtn">＋ إضافة صور<input id="photosInput" type="file" accept="image/*" multiple hidden></label></div><div id="gallery" class="gallery"></div></div><button class="primary" id="saveBtn" type="submit">حفظ المستهدف</button></form></div></div><div id="toast" class="toast hidden"></div><script src="/app.js"></script></body></html>
